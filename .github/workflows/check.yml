name: Alaska Award Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:  # Manual trigger

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install playwright python-dateutil
          playwright install chromium --with-deps

      - name: Check fares
        id: fares
        run: python check_once.py

      - name: Send email if deals found
        if: steps.fares.outputs.has_deals == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Alaska Award DEAL: SEA-TPE < ${{ secrets.THRESHOLD }}k!"
          to: ${{ secrets.EMAIL_TO }}
          from: Alaska Award Bot
          body: ${{ steps.fares.outputs.message }}
